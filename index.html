<title>Sagittaire</title>
<meta name="description" content="Sagittaire — tir à l'arc : cible, volées, statistiques, matériel et compétitions en direct.">
<meta name="theme-color" content="#0B1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sagittaire">

<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<script>var t="dark";try{var s=localStorage.getItem("sg_theme");if(s==="light")t=s;}catch(e){}document.documentElement.setAttribute("data-theme",t);</script>
<script defer src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
:root{
  --bg:#F3F5F8;--surface:#FFFFFF;--surface2:#EEF2F7;--ink:#0E1726;--muted:#5D6B7E;--line:#D8DFE8;
  --accent:#D9A21B;--accent-ink:#1A1300;--blue:#2F6FD6;--good:#24965A;--bad:#D0473F;--chip:#E6ECF3;
  --shadow:0 6px 24px rgba(10,20,40,.08);
}
:root[data-theme="dark"]{
  --bg:#0B1220;--surface:#131C2E;--surface2:#1A2539;--ink:#E8EEF6;--muted:#93A1B5;--line:#26324A;
  --accent:#F2B935;--accent-ink:#1A1300;--blue:#6EA1FF;--good:#3CC27A;--bad:#FF6B61;--chip:#22304A;
  --shadow:0 6px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none !important}
a{color:var(--blue)}
.wrap{max-width:760px;margin:0 auto;padding:max(.6rem,env(safe-area-inset-top)) .9rem calc(6.5rem + env(safe-area-inset-bottom))}
/* barre du haut */
.top{display:flex;align-items:center;gap:.4rem;margin:.2rem 0 .8rem;min-width:0}
.top .brand{flex:0 0 auto}
.top .sp{min-width:0}
.who span:first-child{min-width:0}
html,body{overflow-x:clip}
@media (max-width:480px){.brand>span{display:none}.top .icon-btn{width:2.1rem;height:2.1rem}.who{padding-left:.55rem}}
.brand{display:flex;align-items:center;gap:.45rem;font-weight:800;font-size:1.2rem;letter-spacing:.01em;text-decoration:none;color:var(--ink)}
.brand-logo{height:2.2rem;width:auto;background:#fff;border-radius:8px;padding:2px 4px;display:block}
.hero-logo{width:100%;max-width:340px;background:#fff;border-radius:16px;padding:.6rem;display:block;margin:0 auto}
.top .sp{flex:1}
.who{display:flex;align-items:center;gap:.4rem;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:.25rem .3rem .25rem .7rem;font-size:.85rem;font-weight:600;min-width:0;flex:0 1 auto;max-width:12rem}
.who span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:2.3rem;height:2.3rem;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;font-size:1rem;flex:0 0 auto}
.dot{width:.55rem;height:.55rem;border-radius:50%;background:var(--muted);flex:0 0 auto}
.dot.on{background:var(--good)}
/* boutons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:.6rem .9rem;min-height:2.7rem;font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:.4rem}
a.btn{text-decoration:none;color:inherit}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.btn.sm{min-height:2.1rem;padding:.3rem .65rem;font-size:.85rem;border-radius:10px}
.btn.full{width:100%}
.btn:disabled{opacity:.45}
.row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.row>.grow{flex:1 1 0;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
/* cartes */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:.9rem;margin-bottom:.8rem;box-shadow:var(--shadow)}
.card h2{margin:0 0 .6rem;font-size:1.05rem}
.card h3{margin:.8rem 0 .4rem;font-size:.95rem}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.hero{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-bottom:.8rem}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:.6rem .7rem}
.kpi b{display:block;font-size:1.35rem;font-variant-numeric:tabular-nums}
.kpi span{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.list{list-style:none;margin:0;padding:0}
.item{display:flex;align-items:center;gap:.6rem;padding:.65rem .2rem;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .main{flex:1;min-width:0}
.item .main b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .main small{color:var(--muted)}
.item .score{font-weight:800;font-size:1.15rem;font-variant-numeric:tabular-nums;text-align:right}
.item .score small{display:block;font-size:.7rem;color:var(--muted);font-weight:600}
.item.click{cursor:pointer}
.tag{display:inline-block;padding:.05rem .45rem;border-radius:6px;background:var(--chip);font-size:.72rem;font-weight:700;color:var(--muted)}
.tag.live{background:#FF5A4E;color:#fff}
.tag.gold{background:var(--accent);color:var(--accent-ink)}
.empty{color:var(--muted);text-align:center;padding:1rem .5rem}
label.f{display:block;font-size:.82rem;font-weight:650;margin:.7rem 0 .3rem;color:var(--muted)}
input.in,select.in,textarea.in{width:100%;padding:.6rem .7rem;border-radius:10px;border:1px solid var(--line);background:var(--surface2);min-height:2.7rem}
input[type=date].in,input[type=time].in{color-scheme:dark}
:root[data-theme="light"] input[type=date].in{color-scheme:light}
.seg{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:.45rem .3rem;font-weight:650;font-size:.85rem;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.15)}
/* navigation du bas */
.nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:.3rem .3rem calc(.3rem + env(safe-area-inset-bottom));z-index:20}
.nav a{flex:1;max-width:150px;text-align:center;text-decoration:none;color:var(--muted);font-size:.7rem;font-weight:650;padding:.25rem 0;border-radius:10px}
.nav a i{display:block;font-style:normal;font-size:1.25rem;line-height:1.3}
.nav a.on{color:var(--accent)}
/* ===== Pointage ===== */
.shoot{display:flex;flex-direction:column;gap:.6rem}
.shoot-head{display:flex;align-items:center;gap:.5rem}
.shoot-head .ttl{flex:1;min-width:0}
.shoot-head .ttl b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shoot-head .ttl small{color:var(--muted)}
.tot{font-size:1.6rem;font-weight:850;font-variant-numeric:tabular-nums;text-align:right;line-height:1}
.tot small{display:block;font-size:.7rem;color:var(--muted);font-weight:650;margin-top:.15rem}
.target-box{position:relative;background:radial-gradient(circle at 50% 40%,#2A3753 0%,#141C2C 70%);border-radius:18px;border:1px solid var(--line);overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none;padding:0 2.1rem}
/* bandes de côté : on y glisse le doigt pour faire défiler la page */
.target-box .scroll-g{position:absolute;top:0;bottom:0;width:2.1rem;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.35);font-size:.9rem;pointer-events:none;background:repeating-linear-gradient(180deg,rgba(255,255,255,.04) 0 10px,transparent 10px 20px)}
.target-box .scroll-g.l{left:0}.target-box .scroll-g.r{right:0}
.target-box svg.tgt{touch-action:pan-y}
.target-box.ro{padding:0}.target-box.ro .scroll-g{display:none}.target-box.ro svg.tgt{touch-action:pan-y}
:root[data-theme="light"] .target-box{background:radial-gradient(circle at 50% 40%,#E8EDF4 0%,#CBD4E0 75%)}
.target-box svg.tgt{display:block;width:100%;height:auto;aspect-ratio:1/1;max-height:58vh;margin:0 auto}
.loupe{position:fixed;width:150px;height:150px;border-radius:50%;border:3px solid #fff;box-shadow:0 8px 24px rgba(0,0,0,.5);overflow:hidden;pointer-events:none;background:#0B1220;display:none;z-index:50}
.loupe svg{width:100%;height:100%}
.loupe .lbl{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-weight:900;font-size:1rem;color:#fff;text-shadow:0 1px 3px #000}
.zoom-tools{position:absolute;right:.5rem;top:.5rem;display:flex;flex-direction:column;gap:.35rem;z-index:3}
.zoom-tools button{width:2.3rem;height:2.3rem;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(10,15,25,.6);color:#fff;font-weight:800}
.end-strip{display:flex;gap:.35rem;align-items:center;min-height:2.6rem;flex-wrap:wrap}
.pill{min-width:2.3rem;height:2.3rem;border-radius:50%;display:inline-grid;place-items:center;font-weight:850;font-size:.95rem;border:2px solid rgba(0,0,0,.15);font-variant-numeric:tabular-nums;position:relative}
.pill.slot{background:transparent;border:2px dashed var(--line);color:var(--muted)}
.pill sup{position:absolute;top:-.35rem;right:-.35rem;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;font-size:.6rem;padding:0 .2rem;font-weight:700}
.pill.sel{outline:3px solid var(--blue);outline-offset:2px}
.keypad{display:grid;grid-template-columns:repeat(6,1fr);gap:.35rem}
.keypad button{border:0;border-radius:10px;min-height:2.6rem;font-weight:850;font-size:1rem}
.numbers{display:flex;gap:.3rem;flex-wrap:wrap}
.numbers button{min-width:2.1rem;height:2.1rem;border-radius:8px;border:1px solid var(--line);background:var(--surface2);font-weight:700;font-size:.85rem}
.numbers button.used{opacity:.35}
.ends{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.9rem}
.ends th{font-size:.68rem;color:var(--muted);text-align:center;padding:.3rem .2rem;font-weight:700}
.ends td{text-align:center;padding:.38rem .15rem;border-top:1px solid var(--line)}
.ends td.a{width:1.9rem}
.ends .mini{display:inline-grid;place-items:center;width:1.6rem;height:1.6rem;border-radius:50%;font-weight:800;font-size:.78rem}
.ends tr.click{cursor:pointer}
.ends tr.cur td{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.ends td.et{font-weight:800}
.ends td.rt{color:var(--muted)}
.dist-h td{background:var(--surface2);font-weight:700;text-align:left !important;font-size:.8rem;color:var(--muted)}
/* stats */
.bars{display:flex;align-items:flex-end;gap:4px;height:120px;padding-top:.4rem}
.bars div{flex:1;border-radius:6px 6px 0 0;position:relative;min-height:2px}
.bars div span{position:absolute;bottom:-1.25rem;left:0;right:0;text-align:center;font-size:.68rem;color:var(--muted);font-weight:700}
.bars div em{position:absolute;top:-1.1rem;left:0;right:0;text-align:center;font-size:.62rem;color:var(--muted);font-style:normal}
.chart svg{width:100%;height:auto;display:block}
.advice{border-left:4px solid var(--accent);background:var(--surface2);padding:.6rem .7rem;border-radius:0 10px 10px 0;font-size:.9rem;margin:.5rem 0}
.mini-tgt{width:100%;max-width:340px;margin:0 auto;display:block}
/* classement */
.lb{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.lb th{font-size:.68rem;color:var(--muted);padding:.35rem .25rem;text-align:center}
.lb td{padding:.5rem .25rem;border-top:1px solid var(--line);text-align:center}
.lb td:nth-child(2),.lb th:nth-child(2){text-align:left}
.lb td.rk{font-weight:800;color:var(--muted);width:1.8rem}
.lb tr.me td{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.lb td.tt{font-weight:850;font-size:1.05rem}
.lb .medal{font-size:1rem}
/* dialogue */
dialog{border:0;border-radius:18px;padding:0;background:var(--surface);color:var(--ink);width:min(94vw,460px);max-height:88vh;box-shadow:0 20px 60px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(5,10,20,.6)}
.dlg{padding:1rem 1rem .9rem;overflow:auto;max-height:88vh}
.dlg h2{margin:0 0 .4rem;font-size:1.15rem}
.dlg .acts{display:flex;gap:.5rem;margin-top:1rem}
.dlg .acts .btn{flex:1}
.toast{position:fixed;left:50%;bottom:5.2rem;transform:translateX(-50%);background:#111A2B;color:#fff;padding:.6rem 1rem;border-radius:12px;font-weight:600;font-size:.9rem;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:90vw;text-align:center}
.pin{display:flex;gap:.5rem;justify-content:center;margin:.6rem 0}
.pin input{width:3rem;height:3.4rem;text-align:center;font-size:1.5rem;font-weight:800;border-radius:12px;border:1px solid var(--line);background:var(--surface2)}
.face-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem}
.face-pick button{border:2px solid var(--line);background:var(--surface2);border-radius:12px;padding:.35rem;font-size:.72rem;font-weight:650}
.face-pick button.on{border-color:var(--accent)}
.face-pick svg{width:100%;height:auto;display:block;margin-bottom:.2rem}
.round-pick{display:grid;gap:.4rem}
.round-pick button{text-align:left;border:2px solid var(--line);background:var(--surface2);border-radius:12px;padding:.55rem .7rem}
.round-pick button.on{border-color:var(--accent)}
.round-pick button b{display:block}
.round-pick button small{color:var(--muted)}
.sight-tbl{width:100%;border-collapse:collapse}
.sight-tbl td{padding:.35rem .2rem;border-top:1px solid var(--line)}
.sight-tbl input{width:5rem}
.chips{display:flex;flex-wrap:wrap;gap:.35rem}
.chip{padding:.3rem .65rem;border-radius:999px;background:var(--chip);font-size:.8rem;font-weight:650;border:1px solid transparent}
.chip.on{border-color:var(--accent);color:var(--accent)}
@media (min-width:700px){.hero{grid-template-columns:repeat(4,1fr)}}
.foot{text-align:center;margin:1.2rem 0 .4rem}
.foot a{color:var(--muted);font-size:.85rem;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:.4rem .9rem;display:inline-block}
@media print{.nav,.top .icon-btn,.no-print{display:none !important}.wrap{padding-bottom:0}}
</style>
</head>

const W = {}, CACHED = /^(archers|comps|sessions\/[^/]+|gear\/[^/]+)$/;

/* ================= Cibles (blasons) =================
   Coordonnées : x, y normalisés au rayon du blason (ou du spot) = 1. Le score tient compte du diamètre de la flèche (la flèche qui touche la ligne prend la valeur supérieure). */
const WA_COL = { 1: "#FFFFFF", 2: "#FFFFFF", 3: "#1B1B1B", 4: "#1B1B1B", 5: "#2A8DE0", 6: "#2A8DE0", 7: "#E5363B", 8: "#E5363B", 9: "#F7C51E", 10: "#F7C51E" };
const LINE = { 1: "#222", 2: "#222", 3: "#777", 4: "#777", 5: "#111", 6: "#111", 7: "#111", 8: "#111", 9: "#111", 10: "#111" };
function waRings(min){ const n = 11 - min, out = []; for(let s = min; s <= 10; s++) out.push({ s: s, r: (11 - s) / n, fill: WA_COL[s], line: LINE[s] }); return out; }
const FACES = {
  wa10:   { name: "WA 10 zones", sizes: [122, 80, 60, 40], def: 122, spots: 1, rings: waRings(1), x: 0.05, rcm: d => d / 2 },
  wa6:    { name: "WA 80 cm réduit (5-10)", sizes: [80], def: 80, spots: 1, rings: waRings(5), x: 1 / 12, rcm: d => d / 2 * 0.6 },
  tri:    { name: "Trispot 40 cm (6-10)", sizes: [40], def: 40, spots: 3, layout: "v", rings: waRings(6), x: 0.1, rcm: d => d / 4 },

  bead:   { name: "3D / Animal (vitales)", sizes: [40], def: 40, spots: 1, x: 0.1,
            rings: [{ s: 5, r: 1, fill: "#7A6A4E", line: "#3E3424" }, { s: 8, r: 0.55, fill: "#9B8762", line: "#2B241A" }, { s: 10, r: 0.3, fill: "#B9A57E", line: "#1E1912" }, { s: 11, r: 0.12, fill: "#D8C79F", line: "#1E1912" }], rcm: d => d / 2 }
};
// Field : anneaux 1 à 4 de largeur égale, puis 5 et 6 (centre doré)
FACES.field.rings = [{ s: 1, r: 1 }, { s: 2, r: 5 / 6 }, { s: 3, r: 4 / 6 }, { s: 4, r: 3 / 6 }, { s: 5, r: 2 / 6 }, { s: 6, r: 1 / 6 }].map(o => Object.assign(o, { fill: o.s >= 5 ? "#F7C51E" : "#1B1B1B", line: o.s >= 5 ? "#222" : "#DDD" }));
const ARROW_CM = 0.3;  // rayon d'une flèche (≈ 6 mm de diamètre)
function spotCenters(face){ // centres des spots, dans la vue -1..1 du blason

  return [{ x: 0, y: -0.64, k: 0.31 }, { x: 0, y: 0, k: 0.31 }, { x: 0, y: 0.64, k: 0.31 }];

function scoreAt(face, size, x, y){  // x,y dans le repère du spot (rayon 1)

  return { s: s, x: isX };
}

function arrowVal(a){ return a && a.s ? Number(a.s) : 0; }

function faceSVG(face, opts){

    g += '<g transform="translate(' + c.x + ' ' + c.y + ') scale(' + c.k + ')">';
    F.rings.forEach(r => { g += '<circle r="' + r.r + '" fill="' + r.fill + '" stroke="' + r.line + '" stroke-width="' + (0.006 / c.k) + '"/>'; });
    g += '<circle r="' + F.x + '" fill="none" stroke="' + (face === "bead" ? "#222" : "#333") + '" stroke-width="' + (0.004 / c.k) + '"/>';
    g += '<path d="M-.03 0H.03M0 -.03V.03" stroke="#333" stroke-width="' + (0.004 / c.k) + '"/>';

}

function toView(face, a){ const c = spotCenters(face)[a.p || 0] || { x: 0, y: 0, k: 1 }; return { x: c.x + a.x * c.k, y: c.y + a.y * c.k }; }
function fromView(face, vx, vy){ // trouve le spot le plus proche

}

/* ================= Calculs ================= */
// Chaque flèche garde son rang de tir dans la volée (i : 0 = 1re tirée) — l'ordre d'entrée est l'ordre de tir
function sessionArrows(s){ const out = []; arr(s && s.ends).forEach((e, ei) => arr(e && e.a).forEach((a, k) => { if(a) out.push(Object.assign({ end: ei, part: e.part || 0, i: k }, a)); })); return out; }
const ORD = n => n === 1 ? "1re" : n + "e";
function dirWords(dx, dy){ const w = []; if(Math.abs(dy) >= Math.abs(dx) * 0.5) w.push(dy > 0 ? "bas" : "haut"); if(Math.abs(dx) >= Math.abs(dy) * 0.5) w.push(dx > 0 ? "droite" : "gauche"); return w.join("-"); }
/* Analyse selon l'ordre de tir : moyenne, % de 10, dispersion et décalage de chaque rang (1re, 2e, 3e…) */
function orderAnalysis(A, face, size){
  const F = FACES[face] || FACES.wa10, R = F.rcm(size || F.def), top = maxScore(face) === 11 ? 10 : maxScore(face), g = grouping(A, face, size);
  const by = {}; A.forEach(a => { const k = a.i || 0; (by[k] = by[k] || []).push(a); });
  const rows = Object.keys(by).map(Number).sort((x, y) => x - y).map(k => { const L = by[k], P = L.filter(a => !a.k && a.x != null);
    const o = { k: k, n: L.length, avg: L.reduce((t, a) => t + arrowVal(a), 0) / L.length, p10: L.filter(a => a.s >= top).length / L.length, miss: L.filter(a => !a.s).length };
    if(g && P.length >= 3){ const mx = P.reduce((t, a) => t + a.x, 0) / P.length, my = P.reduce((t, a) => t + a.y, 0) / P.length;
      o.dx = (mx - g.mx) * R; o.dy = (my - g.my) * R; o.rad = P.reduce((t, a) => t + Math.hypot(a.x - mx, a.y - my), 0) / P.length * R; o.np = P.length; }
    return o; }).filter(o => o.n >= 3);
  const all = A.length ? A.reduce((t, a) => t + arrowVal(a), 0) / A.length : 0, notes = [];
  rows.forEach(o => {
    const others = A.filter(a => (a.i || 0) !== o.k), oa = others.length ? others.reduce((t, a) => t + arrowVal(a), 0) / others.length : all, d = o.avg - oa;
    const off = o.dx != null ? Math.hypot(o.dx, o.dy) : 0, sig = o.dx != null && off >= 1.5 && g && off >= g.cmRad * 0.3;
    if(d <= -0.35 || sig){
      let why = o.k === 0 ? "départ trop rapide (pas assez de temps pour s'installer) ?" : (o.k === rows.length - 1 && rows.length >= 3 ? "fatigue ou relâchement en fin de volée ?" : "perte de concentration au milieu de la volée ?");
      notes.push("⚠ <b>" + ORD(o.k + 1) + " flèche</b> : " + (d <= -0.35 ? dec(Math.abs(d)) + " point de moins que les autres" : "") + (d <= -0.35 && sig ? ", et elle " : (sig ? "Elle " : "")) + (sig ? "tombe " + dec(off, 1) + " cm vers le " + dirWords(o.dx, o.dy) + " du groupement" : "") + " — " + why);
    }
  });
  const best = rows.slice().sort((x, y) => y.avg - x.avg)[0];
  if(best && rows.length > 1){ const oth = A.filter(a => (a.i || 0) !== best.k), d = best.avg - (oth.length ? oth.reduce((t, a) => t + arrowVal(a), 0) / oth.length : all); if(d >= 0.35) notes.push("✅ <b>" + ORD(best.k + 1) + " flèche</b> : votre meilleure (+" + dec(d) + " point par rapport aux autres)."); }
  // dérèglement répété : décalage constant dans la même direction pour un même rang
  return { rows: rows, notes: notes, g: g };
}
function orderTable(oa){
  if(!oa.rows.length) return '<p class="empty">Il faut au moins 3 volées pour comparer l\'ordre de tir.</p>';
  return '<div style="overflow-x:auto"><table class="ends"><tr><th>Rang</th><th>Flèches</th><th>Moy.</th><th>% 10</th><th>M</th><th>Disp.</th><th>Décalage</th></tr>' +
    oa.rows.map(o => '<tr><td><b>' + ORD(o.k + 1) + '</b></td><td>' + o.n + '</td><td class="et">' + dec(o.avg) + '</td><td>' + Math.round(o.p10 * 100) + ' %</td><td>' + o.miss + '</td><td>' + (o.rad != null ? dec(o.rad, 1) + " cm" : "—") + '</td><td>' + (o.dx != null ? (Math.hypot(o.dx, o.dy) < 0.5 ? "centré" : dec(Math.hypot(o.dx, o.dy), 1) + " cm " + dirWords(o.dx, o.dy)) : "—") + '</td></tr>').join("") + '</table></div>' +
    (oa.notes.length ? oa.notes.map(n => '<div class="advice">' + n + '</div>').join("") : '<p class="small muted">Aucun écart marqué selon l\'ordre de tir : belle régularité.</p>') +
    '<p class="small muted">Disp. = dispersion des flèches de ce rang ; Décalage = où elles tombent par rapport à l\'ensemble du groupement.</p>';
}
// Au fil de la séance : début / milieu / fin (fatigue, échauffement)
function phaseAnalysis(list){ // list : [{v, f}] f = position 0..1 dans la séance
  if(list.length < 18) return null;
  const B = [[0, 1 / 3, "Début"], [1 / 3, 2 / 3, "Milieu"], [2 / 3, 1.01, "Fin"]].map(b => { const L = list.filter(x => x.f >= b[0] && x.f < b[1]); return { l: b[2], n: L.length, avg: L.length ? L.reduce((t, x) => t + x.v, 0) / L.length : 0 }; });
  let note = ""; if(B[2].n && B[1].n && B[2].avg < B[1].avg - 0.3) note = "⚠ Baisse en fin de séance (" + dec(B[1].avg - B[2].avg) + " point par flèche) : fatigue physique ou mentale ? Pensez aux pauses, à l'hydratation et à la préparation physique.";
  else if(B[0].n && B[1].n && B[0].avg < B[1].avg - 0.3) note = "⚠ Début plus faible (" + dec(B[1].avg - B[0].avg) + " point par flèche) : échauffement trop court ?";
  return { b: B, note: note };
}
function sessionSummary(s){
  const ends = arr(s && s.ends).filter(e => e && arr(e.a).length), A = sessionArrows(s);
  const tot = A.reduce((t, a) => t + arrowVal(a), 0), n = A.length;
  const xs = A.filter(a => a.X && a.s >= 10).length, tens = A.filter(a => a.s >= 10).length, miss = A.filter(a => !a.s).length;
  const planned = s && s.parts ? arr(s.parts).reduce((t, p) => t + (p.ends || 0) * (p.ape || 0), 0) : 0;
  const maxA = s && s.parts ? arr(s.parts).reduce((t, p) => t + (p.ends || 0) * (p.ape || 0) * maxScore(p.face), 0) : 0;
  return { tot: tot, n: n, x: xs, t10: tens, miss: miss, ends: ends.length, avg: n ? tot / n : 0, planned: planned, max: maxA };
}
// Groupement : centre et dispersion (en cm sur le blason), à partir des positions dans le spot
function grouping(A, face, size){
  const P = A.filter(a => a.x != null && a.y != null && !a.k); if(P.length < 2) return null;
  const F = FACES[face] || FACES.wa10, R = F.rcm(size || F.def);
  const mx = P.reduce((t, a) => t + a.x, 0) / P.length, my = P.reduce((t, a) => t + a.y, 0) / P.length;
  const sx = Math.sqrt(P.reduce((t, a) => t + (a.x - mx) ** 2, 0) / P.length), sy = Math.sqrt(P.reduce((t, a) => t + (a.y - my) ** 2, 0) / P.length);
  const rad = P.reduce((t, a) => t + Math.hypot(a.x - mx, a.y - my), 0) / P.length;
  return { mx: mx, my: my, sx: sx, sy: sy, rad: rad, cmx: mx * R, cmy: my * R, cmRad: rad * R, n: P.length, R: R };
}
function sightAdvice(g){
  if(!g || g.n < 6) return "";
  const dx = g.cmx, dy = -g.cmy, lim = Math.max(1.5, g.cmRad * 0.35), parts = [];
  if(Math.abs(dx) > lim) parts.push(dec(Math.abs(dx), 1) + " cm " + (dx > 0 ? "à droite" : "à gauche"));
  if(Math.abs(dy) > lim) parts.push(dec(Math.abs(dy), 1) + " cm " + (dy > 0 ? "en haut" : "en bas"));
  if(!parts.length) return "🎯 Groupement bien centré. Concentrez-vous sur sa taille (rayon moyen " + dec(g.cmRad, 1) + " cm).";
  const mv = []; if(Math.abs(dx) > lim) mv.push(dx > 0 ? "vers la droite" : "vers la gauche"); if(Math.abs(dy) > lim) mv.push(dy > 0 ? "vers le haut" : "vers le bas");
  return "🔧 Le groupement est décalé de " + parts.join(" et ") + ". Si c'est constant, déplacez le viseur " + mv.join(" et ") + " (le viseur suit les flèches).";
}
function arrowNumberReport(A, g){
  if(!g) return [];
  const by = {}; A.forEach(a => { if(a.n && a.x != null && !a.k){ (by[a.n] = by[a.n] || []).push(Math.hypot(a.x - g.mx, a.y - g.my)); } });
  const out = Object.keys(by).filter(k => by[k].length >= 3).map(k => ({ n: k, c: by[k].length, d: by[k].reduce((t, v) => t + v, 0) / by[k].length * g.R }));
  const avg = out.length ? out.reduce((t, o) => t + o.d, 0) / out.length : 0;
  out.forEach(o => { o.bad = out.length >= 3 && o.d > avg * 1.35 && o.d - avg > 1; });
  return out.sort((a, b) => Number(a.n) - Number(b.n));
}

function lineChart(P, max){
  if(P.length < 2) return '<p class="empty">Il faut au moins 2 séances pour tracer la progression.</p>';
  const W = 600, H = 220, L = 34, B = 26, T = 10, R = 10, ys = P.map(p => p.v), lo = Math.max(0, Math.floor(Math.min.apply(null, ys) - 0.5)), hi = Math.min(max, Math.ceil(Math.max.apply(null, ys) + 0.5));
  const X = i => L + (W - L - R) * (P.length === 1 ? 0.5 : i / (P.length - 1)), Y = v => T + (H - T - B) * (1 - (v - lo) / Math.max(0.5, hi - lo));
  let g = ""; for(let v = lo; v <= hi; v++){ g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(v) + '" y2="' + Y(v) + '" stroke="var(--line)"/><text x="' + (L - 6) + '" y="' + (Y(v) + 4) + '" text-anchor="end" font-size="11" fill="var(--muted)">' + v + '</text>'; }
  // moyenne mobile (5 séances)
  const mm = P.map((p, i) => { const w = P.slice(Math.max(0, i - 4), i + 1); return w.reduce((t, q) => t + q.v, 0) / w.length; });
  const path = P.map((p, i) => (i ? "L" : "M") + X(i) + " " + Y(p.v)).join(""), path2 = mm.map((v, i) => (i ? "L" : "M") + X(i) + " " + Y(v)).join("");
  const step = Math.max(1, Math.ceil(P.length / 6));
  const lbl = P.map((p, i) => i % step === 0 || i === P.length - 1 ? '<text x="' + X(i) + '" y="' + (H - 6) + '" text-anchor="middle" font-size="11" fill="var(--muted)">' + esc(p.l) + '</text>' : "").join("");
  return '<svg viewBox="0 0 ' + W + ' ' + H + '">' + g + '<path d="' + path + '" fill="none" stroke="var(--blue)" stroke-width="2" opacity=".55"/>' + P.map((p, i) => '<circle cx="' + X(i) + '" cy="' + Y(p.v) + '" r="3.5" fill="var(--blue)"><title>' + esc(p.l) + " : " + dec(p.v) + '</title></circle>').join("") + '<path d="' + path2 + '" fill="none" stroke="var(--accent)" stroke-width="3"/>' + lbl + '</svg><p class="small muted" style="margin:.2rem 0 0"><span style="color:var(--blue)">●</span> chaque séance · <span style="color:var(--accent)">━</span> tendance (5 dernières)</p>';
}

function viewComp(v, cid){
  let C = null, divF = LS.get("sg_divF", "");
  v.appendChild(h('<div class="card"><div class="row"><div class="grow"><h2 id="cTitle" style="margin:0">Compétition</h2><div class="muted small" id="cSub"></div></div><button class="btn sm" id="cEdit" hidden>✏️</button></div><div class="row" id="cActs" style="margin-top:.7rem"></div></div>'));
  v.appendChild(h('<div class="card"><div class="row" style="margin-bottom:.4rem"><h2 class="grow" style="margin:0">Classement <span class="tag live" id="cLive" hidden>EN DIRECT</span></h2><button class="btn sm no-print" id="cShare">🔗 Partager</button></div><div class="seg" id="cDivSeg" style="margin-bottom:.5rem"></div><div style="overflow-x:auto"><table class="lb" id="cLb"></table></div><p class="small muted" style="margin:.5rem 0 0">Égalité : départage aux X, puis aux 10.</p></div>'));
  $("cShare").onclick = () => { const url = location.origin + location.pathname + "#/c/" + cid; if(navigator.share) navigator.share({ title: C ? C.name : "Compétition", url: url }).catch(() => {}); else { try{ navigator.clipboard.writeText(url); toast("Lien copié."); }catch(e){ prompt("Lien :", url); } } };
  function draw(){
    if(!C){ $("cTitle").textContent = "Compétition introuvable"; return; }
    const r = roundById(C.round), A = obj(C.archers), R = obj(C.results), t = today();
    $("cTitle").textContent = "🏆 " + C.name;
    $("cSub").innerHTML = [esc(fmtDate(C.date)), placeHtml(C.place), esc(r.name + " — " + r.desc)].filter(Boolean).join(" · ");
    $("cLive").hidden = C.date !== t;
    $("cEdit").hidden = !((me && C.owner === me.id) || isAdmin()); $("cEdit").onclick = () => compDlg(cid, C);
    const acts = $("cActs"); acts.innerHTML = "";
    if(me && A[me.id]){
      const sid = A[me.id].sid;
      acts.appendChild(h('<a class="btn pri grow" href="#/s/' + me.id + '/' + sid + '">🎯 Pointer mes volées</a>'));
      const b = h('<button class="btn sm danger">Me retirer</button>'); b.onclick = () => confirmBox("Vous retirer de la compétition ? Votre séance est conservée.", "Me retirer").then(ok => { if(ok){ put("comps/" + cid + "/archers/" + me.id, null); put("comps/" + cid + "/results/" + me.id, null); } }); acts.appendChild(b);
    } else {
      const b = h('<button class="btn pri grow">✋ M\'inscrire</button>'); b.onclick = () => { if(needMe()) joinDlg(); }; acts.appendChild(b);
    }
    const divs = String(C.divisions || "R").split(",").filter(Boolean);
    if(divF && divs.indexOf(divF) < 0) divF = "";
    $("cDivSeg").innerHTML = '<button data-d=""' + (divF === "" ? ' class="on"' : "") + '>Toutes</button>' + divs.map(d => '<button data-d="' + d + '"' + (divF === d ? ' class="on"' : "") + '>' + BOW_TYPES[d].split(" ")[0] + '</button>').join("");
    $("cDivSeg").hidden = divs.length < 2;
    $("cDivSeg").querySelectorAll("button").forEach(b => b.onclick = () => { divF = b.dataset.d; LS.set("sg_divF", divF); draw(); });
    const planned = arr(r.parts).reduce((tt, p) => tt + p.ends, 0), maxS = arr(r.parts).reduce((tt, p) => tt + p.ends * p.ape * maxScore(p.face), 0);
    const rows = Object.keys(A).filter(k => !divF || A[k].div === divF).map(k => Object.assign({ id: k, name: A[k].name, div: A[k].div, club: A[k].club }, { tot: 0, x: 0, t10: 0, n: 0, ends: [] }, obj(R[k])))
      .sort((a, b) => b.tot - a.tot || b.x - a.x || b.t10 - a.t10 || a.name.localeCompare(b.name, "fr"));
    const L = $("cLb");
    if(!rows.length){ L.innerHTML = '<tr><td class="empty">Aucun archer inscrit' + (divF ? " dans cette division" : "") + '.</td></tr>'; return; }
    const medal = i => ["🥇", "🥈", "🥉"][i] || (i + 1);
    L.innerHTML = '<tr><th>#</th><th>Archer</th><th>Volées</th><th>X</th><th>10</th><th>Total</th></tr>' + rows.map((o, i) => {
      const ends = arr(o.ends), last = ends.length ? ends[ends.length - 1] : null;
      return '<tr class="' + (me && o.id === me.id ? "me" : "") + '"><td class="rk"><span class="medal">' + (o.n ? medal(i) : "–") + '</span></td><td><b>' + esc(o.name) + '</b><div class="small muted">' + esc([divs.length > 1 && !divF ? BOW_TYPES[o.div].split(" ")[0] : "", o.club].filter(Boolean).join(" · ")) + (last != null ? ' · dernière volée ' + last : "") + '</div></td><td>' + ends.length + '/' + planned + '</td><td>' + (o.x || 0) + '</td><td>' + (o.t10 || 0) + '</td><td class="tt">' + (o.tot || 0) + '<div class="small muted" style="font-weight:600">' + (o.n ? dec(o.tot / o.n) + "/fl." : "") + '</div></td></tr>';
    }).join("");
    void maxS;
  }
  function joinDlg(){
    const divs = String(C.divisions || "R").split(","), a = archers[me.id] || {}, def = divs.indexOf(a.bow) >= 0 ? a.bow : divs[0];
    dialog('<h2>Inscription</h2><p>' + esc(C.name) + '<br><span class="muted small">' + esc(roundById(C.round).desc) + '</span></p><label class="f">Division</label><select class="in" id="jD">' + divs.map(d => '<option value="' + d + '"' + (d === def ? " selected" : "") + '>' + BOW_TYPES[d] + '</option>').join("") + '</select><div class="acts"><button class="btn" data-close>Annuler</button><button class="btn pri" id="jOk">M\'inscrire</button></div>',
    b => b.querySelector("#jOk").onclick = () => {
      const r = roundById(C.round), sid = uid(), lg = LS.get("sg_lastGear", {});
      put("sessions/" + me.id + "/" + sid, { date: C.date, t: Date.now(), round: r.id, title: C.name, place: C.place || "", parts: r.parts, comp: cid, bow: lg.bow || "", arrows: lg.arrows || "" });
      put("comps/" + cid + "/archers/" + me.id, { name: me.name, div: b.querySelector("#jD").value, club: a.club || "", sid: sid, t: Date.now() });
      $("dlg").close(); toast("Inscrit ! Bonne compétition.");
    });
  }
  sub("comps/" + cid, val => { C = val; draw(); });
}

/* ================= Administration ================= */
function adminLogin(){
  if(isAdmin()){ adminOn = false; LS.set("sg_admin", false); toast("Mode administrateur désactivé."); route(); return; }
  const first = !CFG.adminPwd;
  dialog('<h2>🛠 Administrateur</h2><p class="muted small">' + (first ? "Aucun mot de passe n\'existe encore : choisissez-en un (6 caractères ou plus). Gardez-le pour vous." : "Entrez le mot de passe administrateur.") + '</p>' +
    '<input class="in" id="adP" type="password" autocomplete="current-password" maxlength="40">' + (first ? '<label class="f">Confirmer</label><input class="in" id="adP2" type="password" maxlength="40">' : "") +
    '<div class="acts"><button class="btn" data-close>Annuler</button><button class="btn pri" id="adOk">Entrer</button></div>',
  b => { const go = () => {
      const pw = b.querySelector("#adP").value;
      if(first){ if(pw.length < 6) return toast("6 caractères minimum."); if(pw !== b.querySelector("#adP2").value) return toast("Les deux mots de passe diffèrent."); put("config/adminPwd", pw); CFG.adminPwd = pw; }
      else if(pw !== CFG.adminPwd) return toast("Mot de passe incorrect.");
      LS.set("sg_adminPwd", pw); adminOn = true; LS.set("sg_admin", true); $("dlg").close(); toast("Mode administrateur activé."); location.hash = "#/admin"; route(); };
    b.querySelector("#adOk").onclick = go; b.querySelector("#adP").onkeydown = e => { if(e.key === "Enter" && !first) go(); }; });
}
function viewAdmin(v){
  if(!isAdmin()){ v.appendChild(h('<div class="card"><h2>🛠 Administration</h2><p class="muted">Réservé à l\'administrateur du club. ' + (CFG.adminPwd ? "Entrez le mot de passe administrateur." : "Aucun mot de passe n\'existe encore : le premier qui entre le choisit.") + '</p><button class="btn pri" id="adIn">' + (CFG.adminPwd ? "Entrer le mot de passe" : "Créer le mot de passe administrateur") + '</button></div>')); $("adIn").onclick = adminLogin; return; }
  const tabs = [["places", "📍 Lieux"], ["rounds", "🎯 Rondes"], ["courses", "🦌 Parcours 3D"], ["archers", "👤 Archers"], ["other", "⚙️ Autres"]];

  v.appendChild(h('<div class="card"><div class="row"><h2 class="grow" style="margin:0">🛠 Administration</h2><button class="btn sm" id="admOut">Quitter</button></div><div class="chips" id="admTabs" style="margin-top:.6rem"></div></div>'));
  v.appendChild(h('<div id="admBody"></div>'));

function roundDlg(id, copyFrom){
  let r0 = id ? roundById(id) : { name: "", desc: "", parts: [{ d: 18, face: "wa10", size: 40, ape: 3, ends: 10 }] }; const builtin = id && ROUNDS.some(r => r.id === id);
  if(copyFrom){ const c = roundById(copyFrom); r0 = { name: (c.name + " (copie)").slice(0, 40), desc: c.desc || "", parts: arr(c.parts).map(p => Object.assign({}, p)) }; }
  const partRow = p => '<div class="card rd-part" style="padding:.5rem;margin:.4rem 0;box-shadow:none"><div class="grid2"><div><label class="f" style="margin-top:0">Distance (m)</label><input class="in rd-d" type="number" min="0" max="150" value="' + esc(p.d) + '"></div><div><label class="f" style="margin-top:0">Volées (0 = illimité)</label><input class="in rd-e" type="number" min="0" max="60" value="' + esc(p.ends) + '"></div>' +
    '<div><label class="f">Blason</label><select class="in rd-f">' + Object.keys(FACES).map(k => '<option value="' + k + '"' + (k === p.face ? " selected" : "") + '>' + esc(FACES[k].name) + '</option>').join("") + '</select></div><div><label class="f">Taille (cm)</label><input class="in rd-s" type="number" min="10" max="122" value="' + esc(p.size) + '"></div>' +
    '<div><label class="f">Flèches / volée</label><input class="in rd-a" type="number" min="1" max="12" value="' + esc(p.ape) + '"></div><div style="display:flex;align-items:flex-end"><button class="btn sm danger rd-x" type="button">Retirer</button></div></div></div>';
  dialog('<h2>' + (id ? "Modifier la ronde" : (copyFrom ? "Copie de « " + esc(roundById(copyFrom).name) + " »" : "Nouvelle ronde")) + '</h2><label class="f">Nom</label><input class="in" id="rN" maxlength="40" value="' + esc(r0.name) + '"><label class="f">Description</label><input class="in" id="rD" maxlength="80" value="' + esc(r0.desc || "") + '">' +
    '<label class="f">Distances</label><div id="rParts">' + arr(r0.parts).map(partRow).join("") + '</div><button class="btn sm" id="rPAdd" type="button">+ Distance</button>' +
    '<label class="row" style="margin-top:.7rem"><input type="checkbox" id="rH"' + (r0.hidden ? " checked" : "") + '> Cachée (n\'est plus proposée)</label>' +
    '<div class="acts">' + (id ? (builtin ? '<button class="btn" id="rReset">Rétablir l\'original</button>' : '<button class="btn danger" id="rDel">Supprimer</button>') : '<button class="btn" data-close>Annuler</button>') + '<button class="btn pri" id="rOk">Enregistrer</button></div>' +
    (id ? '<button class="btn ghost full small" id="rDup" style="margin-top:.5rem">⧉ Dupliquer pour une nouvelle ronde</button>' : ""),
  b => {
    const wire = () => b.querySelectorAll(".rd-x").forEach(x => x.onclick = () => { if(b.querySelectorAll(".rd-part").length > 1) x.closest(".rd-part").remove(); });
    wire(); b.querySelector("#rPAdd").onclick = () => { b.querySelector("#rParts").insertAdjacentHTML("beforeend", partRow({ d: 18, face: "wa10", size: 40, ape: 3, ends: 10 })); wire(); };
    const dup = b.querySelector("#rDup"); if(dup) dup.onclick = () => { $("dlg").close(); setTimeout(() => roundDlg(null, id), 50); };
    const rs = b.querySelector("#rReset"); if(rs) rs.onclick = () => { put("config/rounds/" + id, null); $("dlg").close(); toast("Ronde rétablie."); };
    const del = b.querySelector("#rDel"); if(del) del.onclick = () => { put("config/rounds/" + id, null); $("dlg").close(); };
    b.querySelector("#rOk").onclick = () => {
      const name = b.querySelector("#rN").value.trim(); if(!name) return toast("Donnez un nom.");
      const parts = Array.from(b.querySelectorAll(".rd-part")).map(x => { const f = x.querySelector(".rd-f").value; return { d: Math.max(0, Number(x.querySelector(".rd-d").value) || 0), face: f, size: Math.max(10, Number(x.querySelector(".rd-s").value) || FACES[f].def), ape: Math.max(1, Math.min(12, Number(x.querySelector(".rd-a").value) || 3)), ends: Math.max(0, Math.min(60, Number(x.querySelector(".rd-e").value) || 0)) }; });
      const free = parts.length === 1 && !parts[0].ends;
      put("config/rounds/" + (id || uid()), { name: name, desc: b.querySelector("#rD").value.trim(), parts: parts, hidden: b.querySelector("#rH").checked || null, free: (id === "free" || (!builtin && free)) || null });
      $("dlg").close(); toast("Ronde enregistrée.");
    };
  });
}
// Photos : réduites (900 px, JPEG) et gardées dans la base, à part, chargées seulement au besoin
function shrinkPhoto(file, max){ return new Promise((res, rej) => { const img = new Image(), u = URL.createObjectURL(file);
  img.onload = () => { const f = Math.min(1, (max || 900) / Math.max(img.width, img.height)), c = document.createElement("canvas"); c.width = Math.round(img.width * f); c.height = Math.round(img.height * f); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u); res(c.toDataURL("image/jpeg", 0.72)); };
  img.onerror = rej; img.src = u; }); }

function courseDlg(id){
  const c = Object.assign({ name: "", place: "", targets: [], hidden: false }, obj(CFG.courses[id])), cid = id || uid();
  let T = arr(c.targets).map((t, i) => Object.assign({ pid: t.pid || String(i) }, t));
  if(!T.length) T = [{ pid: uid(), animal: "", dist: "", notes: "" }];
  const pending = {};   // photos nouvellement choisies (pid -> dataURL)
  const row = (t, i) => '<div class="card co-t" data-pid="' + t.pid + '" style="padding:.5rem;margin:.4rem 0;box-shadow:none;display:grid;grid-template-columns:4.6rem 1fr;gap:.5rem;align-items:start">' +
    '<label style="cursor:pointer"><img class="co-img" alt="" style="width:4.6rem;height:4.6rem;object-fit:cover;border-radius:10px;background:var(--surface2);display:block"><input type="file" accept="image/*" class="co-file" hidden><span class="small muted" style="display:block;text-align:center">📷 Photo</span></label>' +
    '<div><div class="row"><b class="small">Cible ' + (i + 1) + '</b><span class="grow"></span><button type="button" class="btn sm co-up">↑</button><button type="button" class="btn sm danger co-x">✕</button></div>' +
    '<input class="in co-a" maxlength="30" placeholder="Animal (ex. : chevreuil)" value="' + esc(t.animal || "") + '" style="margin-top:.3rem"><div class="grid2" style="margin-top:.3rem"><input class="in co-d" inputmode="numeric" maxlength="6" placeholder="Distance (m)" value="' + esc(t.dist || "") + '"><input class="in co-n" maxlength="40" placeholder="Note" value="' + esc(t.notes || "") + '"></div></div></div>';
  dialog('<h2>' + (id ? "Modifier le parcours" : "Nouveau parcours 3D") + '</h2><label class="f">Nom</label><input class="in" id="coN" maxlength="40" value="' + esc(c.name) + '" placeholder="Ex. : Sentier du club"><label class="f">Lieu</label><input class="in" id="coP" maxlength="40" value="' + esc(c.place) + '" list="coPl"><datalist id="coPl">' + placeList().map(p => '<option value="' + esc(p.name) + '">').join("") + '</datalist>' +
    '<label class="f">Cibles du sentier</label><div id="coT"></div><button class="btn sm" id="coTAdd" type="button">+ Cible</button>' +
    '<label class="row" style="margin-top:.7rem"><input type="checkbox" id="coH"' + (c.hidden ? " checked" : "") + '> Caché</label>' +
    '<div class="acts">' + (id ? '<button class="btn danger" id="coDel">Supprimer</button>' : '<button class="btn" data-close>Annuler</button>') + '<button class="btn pri" id="coOk">Enregistrer</button></div>',
  b => {
    const read = () => Array.from(b.querySelectorAll(".co-t")).map(x => { const o = T.find(t => t.pid === x.dataset.pid) || {}; return Object.assign({}, o, { pid: x.dataset.pid, animal: x.querySelector(".co-a").value.trim(), dist: x.querySelector(".co-d").value.trim(), notes: x.querySelector(".co-n").value.trim() }); });
    const draw = () => { const box = b.querySelector("#coT"); box.innerHTML = T.map(row).join("");
      box.querySelectorAll(".co-t").forEach((x, i) => { const pid = x.dataset.pid, img = x.querySelector(".co-img");
        if(pending[pid]) img.src = pending[pid]; else if(T[i].photo) once("coursePhotos/" + cid + "/" + pid).then(u => { if(u) img.src = u; });
        x.querySelector(".co-file").onchange = e => { const f = e.target.files[0]; if(!f) return; shrinkPhoto(f, 900).then(u => { pending[pid] = u; img.src = u; }, () => toast("Photo illisible.")); };
        x.querySelector(".co-x").onclick = () => { T = read(); T.splice(i, 1); pending[pid] = null; draw(); };
        x.querySelector(".co-up").onclick = () => { T = read(); if(i > 0){ const t = T[i]; T[i] = T[i - 1]; T[i - 1] = t; draw(); } };
      }); };
    draw();
    b.querySelector("#coTAdd").onclick = () => { T = read(); T.push({ pid: uid(), animal: "", dist: "", notes: "" }); draw(); b.querySelector("#coT").lastElementChild.scrollIntoView({ block: "nearest" }); };
    const del = b.querySelector("#coDel"); if(del) del.onclick = () => confirmBox("Supprimer ce parcours et ses photos ?", "Supprimer").then(ok => { if(ok){ put("config/courses/" + cid, null); put("coursePhotos/" + cid, null); } });
    b.querySelector("#coOk").onclick = () => {
      const name = b.querySelector("#coN").value.trim(); if(!name) return toast("Donnez un nom au parcours.");
      T = read(); if(!T.length) return toast("Ajoutez au moins une cible.");
      Object.keys(pending).forEach(pid => { put("coursePhotos/" + cid + "/" + pid, pending[pid] || null); });
      const targets = T.map(t => { const o = { pid: t.pid, animal: t.animal, dist: t.dist, notes: t.notes }; if(pending[t.pid] || (t.photo && pending[t.pid] !== null)) o.photo = true; return o; });
      put("config/courses/" + cid, { name: name, place: b.querySelector("#coP").value.trim(), targets: targets, hidden: b.querySelector("#coH").checked || null });
      $("dlg").close(); toast("Parcours enregistré (" + targets.length + " cibles).");
    };
  });
}
function admArchers(B){
  const L = Object.keys(archers).filter(k => archers[k] && archers[k].name).sort((a, b) => archers[a].name.localeCompare(archers[b].name, "fr"));
  B.appendChild(h('<div class="card"><h2>Archers (' + L.length + ')</h2><p class="small muted" style="margin-top:-.3rem">Touchez un archer pour le modifier ou lui donner un nouveau NIP ; 🗑 supprime son compte.</p><ul class="list">' + (L.map(k => '<li class="item click" data-a="' + k + '"><div class="main"><b>' + esc(archers[k].name) + '</b><small>' + esc([archers[k].club, BOW_TYPES[archers[k].bow]].filter(Boolean).join(" · ")) + '</small></div><button class="btn sm danger" data-del="' + k + '" aria-label="Supprimer">🗑</button></li>').join("") || '<li class="empty">Aucun archer.</li>') + '</ul></div>'));
  const delArcher = id => { const a = archers[id]; if(!a) return; confirmBox("Supprimer le compte de " + a.name + " avec toutes ses séances et son matériel ? C'est définitif.", "Supprimer").then(ok => { if(!ok) return;
    put("archers/" + id, null); put("sessions/" + id, null); put("gear/" + id, null);
    once("comps").then(C => Object.keys(obj(C)).forEach(c => { if(obj(C[c].archers)[id]){ put("comps/" + c + "/archers/" + id, null); put("comps/" + c + "/results/" + id, null); } }));
    if(me && me.id === id) setMe(null); toast("Compte supprimé."); }); };
  B.querySelectorAll("[data-del]").forEach(x => x.onclick = e => { e.stopPropagation(); delArcher(x.dataset.del); });
  B.querySelectorAll("[data-a]").forEach(li => li.onclick = () => { const id = li.dataset.a, a = archers[id];
    dialog('<h2>' + esc(a.name) + '</h2><label class="f">Nom</label><input class="in" id="xN" maxlength="40" value="' + esc(a.name) + '"><label class="f">Club</label><input class="in" id="xC" maxlength="40" value="' + esc(a.club || "") + '"><label class="f">Type d\'arc</label><select class="in" id="xB">' + Object.keys(BOW_TYPES).map(k => '<option value="' + k + '"' + (k === a.bow ? " selected" : "") + '>' + BOW_TYPES[k] + '</option>').join("") + '</select>' +
      '<label class="f">Nouveau NIP (oubli)</label><input class="in" id="xP" inputmode="numeric" maxlength="4" placeholder="Laisser vide pour garder">' +
      '<div class="row" style="margin-top:.6rem"><a class="btn sm" href="#/a/' + id + '" id="xSee">Voir ses séances</a></div>' +
      '<div class="acts"><button class="btn danger" id="xDel">Supprimer</button><button class="btn pri" id="xOk">Enregistrer</button></div>',
    b => { b.querySelector("#xSee").onclick = () => $("dlg").close();
      b.querySelector("#xDel").onclick = () => { $("dlg").close(); setTimeout(() => delArcher(id), 50); };
      b.querySelector("#xOk").onclick = () => { const n = b.querySelector("#xN").value.trim(), pin = b.querySelector("#xP").value.trim(); if(n.length < 2) return toast("Nom trop court."); if(pin && !/^\d{4}$/.test(pin)) return toast("Le NIP doit avoir 4 chiffres.");
        put("archers/" + id + "/name", n); put("archers/" + id + "/club", b.querySelector("#xC").value.trim()); put("archers/" + id + "/bow", b.querySelector("#xB").value); if(pin) put("archers/" + id + "/pin", pin); $("dlg").close(); toast("Enregistré."); }; }); });
}
function admOther(B){
  B.appendChild(h('<div class="card"><h2>Autres</h2><p class="small muted">En mode administrateur, vous pouvez aussi ouvrir et corriger la séance de n\'importe quel archer (Accueil → Archers), et modifier ou supprimer toutes les compétitions.</p><label class="f">Changer le mot de passe administrateur</label><input class="in" id="oP" type="password" maxlength="40"><button class="btn sm" id="oOk" style="margin-top:.5rem">Enregistrer</button></div>'));
  $("oOk").onclick = () => { const p = $("oP").value; if(p.length < 6) return toast("6 caractères minimum."); put("config/adminPwd", p); LS.set("sg_adminPwd", p); CFG.adminPwd = p; toast("Mot de passe changé."); };
}

/* ================= Démarrage ================= */
function boot(){
  initDB(); renderWho();
  $("whoBtn").onclick = () => loginDialog();
  $("themeBtn").onclick = () => { const t = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark"; document.documentElement.setAttribute("data-theme", t); LS.set("sg_theme", t); try{ localStorage.setItem("sg_theme", t); }catch(e){} $("themeBtn").textContent = t === "dark" ? "☀️" : "🌙"; };
  $("themeBtn").textContent = document.documentElement.getAttribute("data-theme") === "dark" ? "☀️" : "🌙";
  if(DB){ try{ DB.ref(".info/connected").on("value", s => { online = !!s.val(); $("netDot").classList.toggle("on", online); $("netDot").title = online ? "En ligne" : "Hors ligne — les tirs seront envoyés au retour du réseau"; }); }catch(e){} }
  $("adminBtn").onclick = () => location.hash = "#/admin";
  if(DB){ const W0 = ref("config"); W0.on("value", s => { const c = obj(s.val()); const before = JSON.stringify(CFG); CFG = { rounds: obj(c.rounds), places: obj(c.places), courses: obj(c.courses), adminPwd: c.adminPwd || "" }; LS.set("sg_cfg", CFG);
    $("adminBtn").hidden = !isAdmin(); if(before !== JSON.stringify(CFG) && !/^#\/(s|admin)\//.test(location.hash) && location.hash.indexOf("#/admin") !== 0 && location.hash.indexOf("#/s/") !== 0) route(); }); }
  window.addEventListener("hashchange", route);
  route();
  if("serviceWorker" in navigator && location.protocol === "https:" && !window.__DB) navigator.serviceWorker.register("sw.js").catch(() => {});
}
if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
})();

</script>
